AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Deploys a VPC with 1 public and 1 private subnet in a single AZ.  Includes route table and Internet Gateway for public subnet. No NAT Gateway.

Parameters:
  VpcCidr:
    Type: String
    Default: 10.200.123.0/24
    Description: IPv4 CIDR block for the VPC

  PublicSubnetCidr:
    Type: String
    Default: 10.200.123.0/25
    Description: IPv4 CIDR block for the public subnet

  PrivateSubnetCidr:
    Type: String
    Default: 10.200.123.128/25
    Description: IPv4 CIDR block for the private subnet

  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: AZ to deploy the subnets into

  VpcName:
    Type: String
    Default: CustomVPC
    Description: Name tag for the VPC

  PublicSubnetName:
    Type: String
    Default: PublicSubnet
    Description: Name tag for the public subnet

  PrivateSubnetName:
    Type: String
    Default: PrivateSubnet
    Description: Name tag for the private subnet

  InternetGatewayName:
    Type: String
    Default: InternetGateway
    Description: Name tag for the Internet Gateway

Resources:

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Ref VpcName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Ref InternetGatewayName

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Ref AvailabilityZone
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Ref PublicSubnetName

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnetCidr
      AvailabilityZone: !Ref AvailabilityZone
      Tags:
        - Key: Name
          Value: !Ref PrivateSubnetName

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: PublicRouteTable

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

Outputs:

  VPCId:
    Value: !Ref VPC
    Description: VPC ID

  PublicSubnetId:
    Value: !Ref PublicSubnet
    Description: Public Subnet ID

  PrivateSubnetId:
    Value: !Ref PrivateSubnet
    Description: Private Subnet ID